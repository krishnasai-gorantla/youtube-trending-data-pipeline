name: Refresh dashboard data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AWS SDK
        run: python -m pip install --disable-pip-version-check boto3
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::303102153405:role/youtube-dashboard-refresh-github-actions
          aws-region: us-east-1
      - name: Refresh dashboard data from latest successful pipeline run
        run: python scripts/refresh_dashboard.py
      - name: Commit dashboard data when changed
        run: |
          if git diff --quiet -- docs/dashboard/data.json; then
            echo "Dashboard data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/data.json
          git commit -m "Refresh dashboard data from latest AWS pipeline run"
          git push origin HEAD:main
